[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-price-tracker"
version = "0.1.0"
description = "Local Phase 1 backend for Amazon Price Tracker & Refund Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=43",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
amazon = ["playwright>=1.49"]

dev = ["pytest>=8.3", "httpx2>=2.16"]

[project.scripts]
tracker-api = "tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tracker = ["schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --import-mode=importlib"
