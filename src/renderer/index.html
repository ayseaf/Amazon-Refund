<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' gbthumb: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self';"
    />
    <title>Groups Browser</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <h1 class="wordmark">Groups</h1>
        <div id="group-list" role="list"></div>
        <button id="new-group" type="button" data-testid="new-group">New group</button>
        <button id="settings" type="button" data-testid="settings">Settings</button>
      </aside>
      <section id="stage">
        <header id="stage-header">
          <div class="heading-block">
            <div class="heading-row">
              <span id="group-glyph" class="group-glyph" hidden></span>
              <h2 id="group-title"></h2>
              <p id="group-count"></p>
            </div>
          </div>
          <div class="header-actions">
            <label class="search">
              <span class="search-icon" aria-hidden="true"></span>
              <input
                id="search"
                data-testid="search"
                type="search"
                placeholder="Search pages"
                autocomplete="off"
                spellcheck="false"
              />
            </label>
            <button id="add-page" class="primary" type="button" data-testid="add-page">Add page</button>
          </div>
        </header>
        <div id="grid-scroll">
          <div id="grid"></div>
        </div>
      </section>
      <section id="preview" data-testid="preview" data-preview-state="closed" hidden>
        <div id="preview-progress" class="preview-progress"></div>
        <header class="preview-bar">
          <div class="preview-id">
            <h2 id="preview-title" data-testid="preview-title"></h2>
            <p id="preview-url" data-testid="preview-url"></p>
            <p id="preview-failed" class="preview-failed" hidden></p>
          </div>
          <div class="preview-actions">
            <button type="button" id="preview-reload" data-testid="preview-reload" aria-label="Reload"></button>
            <button type="button" id="preview-external" data-testid="preview-external" aria-label="Open in default browser"></button>
            <button type="button" id="save-to-group" class="primary" data-testid="save-to-group">Save to group…</button>
            <button type="button" id="preview-close" data-testid="preview-close" aria-label="Close preview"></button>
          </div>
        </header>
        <div id="preview-surface"></div>
      </section>
    </div>
    <div id="dialog-root"></div>
    <div id="toast" class="toast" role="status"></div>
    <script src="js/icons.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
