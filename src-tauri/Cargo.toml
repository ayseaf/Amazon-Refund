[package]
name = "amazon-price-tracker"
version = "0.1.0"
description = "Amazon Price Tracker & Refund Assistant desktop shell"
authors = ["Local user"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "amazon_price_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
